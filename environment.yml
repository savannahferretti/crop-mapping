# Cross-platform compatible: conda env export --from-history>environment.yml
# Platform and package-specific: conda env export ENVNAME>environment.yml
# Platform, package, and channel-specific: conda list --explicit>environment.txt
name: crop-mapping
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - geopandas
  - pyarrow
  - rasterio
  - matplotlib
  - numpy
  - pandas
  - scikit-learn
  - lightgbm
  - ipykernel
  - nbconvert
  - pip:
    - ftw-tools
    - olmoearth-pretrain
    - torch
